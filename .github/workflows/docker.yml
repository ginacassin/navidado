# Opcional: construye la imagen para amd64 y arm64 (Raspberry Pi) y la publica en GHCR.
# Úsalo si no quieres compilar en la Raspberry: en Dokploy elige «Docker» como source con ghcr.io/<usuario>/navidado:latest.
name: Imagen Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/navidado:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
